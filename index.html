<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 趣味 KOL 合作邀約生成系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 mb-6">
        <div class="max-w-6xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-4">
            <h1 class="text-xl font-bold flex items-center gap-2">
                ✨ AI 趣味 KOL 合作邀約生成系統
            </h1>
            <!-- API Key 設定 -->
            <div class="flex items-center gap-2 bg-indigo-700 px-3 py-1.5 rounded-lg text-xs">
                <span>Gemini API Key:</span>
                <input type="password" id="apiKeyInput" placeholder="請輸入 Gemini API Key" class="bg-indigo-800 text-white px-2 py-1 rounded border border-indigo-500 focus:outline-none w-48">
                <button onclick="saveApiKey()" class="bg-indigo-500 hover:bg-indigo-400 px-2 py-1 rounded transition">儲存</button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 flex-grow w-full grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
        
        <!-- 左側：輸入表單與 AI 處理區 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-5">
            <h2 class="text-lg font-semibold text-indigo-900 border-b pb-2">1. 填寫與 AI 智慧萃取</h2>

            <!-- 品牌概要欄位 + AI 改寫 -->
            <div>
                <div class="flex justify-between items-center mb-1">
                    <label class="block text-sm font-medium text-slate-700">原始品牌/產品概要</label>
                    <button onclick="aiRefineBrand()" class="text-xs bg-purple-100 hover:bg-purple-200 text-purple-700 px-2 py-1 rounded font-medium transition flex items-center gap-1">
                        🪄 AI 濃縮亮點
                    </button>
                </div>
                <textarea id="brandSummary" rows="4" class="w-full rounded-lg border border-slate-300 p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="請貼上長篇大論的品牌介紹、新聞稿或產品說明，AI 會自動幫你提煉出適合寫進信件的吸睛賣點..."></textarea>
            </div>

            <!-- KOL 資訊與特色手動填寫 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">KOL 帳號 / 名稱與近期觀察特色</label>
                <input type="text" id="kolName" placeholder="例如：卡特 / @cat_daily" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm mb-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <textarea id="kolHighlights" rows="3" class="w-full rounded-lg border border-slate-300 p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="手動輸入 KOL 的特色（例如：近期都在發露營穿搭、限動常搞笑吐槽、說話風格直率幽默等）"></textarea>
            </div>

            <!-- 信件風格設定 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">信件調性設定</label>
                <select id="toneSelect" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="humorous">幽默好玩、像朋友聊天（推最高回覆率）</option>
                    <option value="sincere">真誠溫暖、有質感與溫度</option>
                    <option value="cool">俐落有型、Z 世代潮流感</option>
                </select>
            </div>

            <button onclick="aiGenerateEmail()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow transition duration-200 mt-2 flex justify-center items-center gap-2">
                <span>🚀 AI 產生超吸睛邀約信</span>
            </button>
        </div>

        <!-- 右側：結果與複製區 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-5">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-lg font-semibold text-indigo-900">2. 生成結果預覽</h2>
                <button onclick="copyToClipboard()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition">
                    📋 一鍵複製全部
                </button>
            </div>

            <!-- 郵件主旨 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">主旨 (Subject Line)</label>
                <input type="text" id="outputSubject" readonly class="w-full bg-slate-50 rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 focus:outline-none">
            </div>

            <!-- 信件內文 -->
            <div class="flex-grow flex flex-col">
                <label class="block text-sm font-medium text-slate-700 mb-1">信件內文 (Body)</label>
                <textarea id="outputBody" rows="14" readonly class="w-full flex-grow bg-slate-50 rounded-lg border border-slate-200 p-3 text-sm text-slate-700 focus:outline-none" placeholder="點擊左側按鈕後，AI 產出的趣味邀約信將會顯示在此..."></textarea>
            </div>

            <p id="copyTip" class="text-xs text-emerald-600 text-right h-4"></p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200">
        AI KOL Invitation System &copy; 2026. Hosted on GitHub Pages.
    </footer>

    <!-- JavaScript 邏輯：使用原生 REST API 支援新型態 API Key -->
    <script>
        window.onload = function() {
            const savedKey = localStorage.getItem('gemini_api_key');
            if (savedKey) {
                document.getElementById('apiKeyInput').value = savedKey;
            }
        };

        function saveApiKey() {
            const key = document.getElementById('apiKeyInput').value.trim();
            if (key) {
                localStorage.setItem('gemini_api_key', key);
                alert('API Key 已儲存至瀏覽器！');
            } else {
                localStorage.removeItem('gemini_api_key');
                alert('API Key 已清除');
            }
        }

        function getApiKey() {
            return document.getElementById('apiKeyInput').value.trim() || localStorage.getItem('gemini_api_key');
        }

        async function callGeminiAPI(promptText) {
            const apiKey = getApiKey();
            if (!apiKey) {
                alert('請先在右上角輸入並儲存您的 Gemini API Key！');
                return null;
            }

            // 使用標準 Gemini 2.5 Flash 終端點
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            const response = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    contents: [{
                        parts: [{ text: promptText }]
                    }]
                })
            });

            const data = await response.json();
            
            if (!response.ok) {
                throw new Error(data.error?.message || 'API 呼叫失敗，請檢查金鑰是否正確');
            }

            return data.candidates[0].content.parts[0].text;
        }

        // 1. AI 濃縮品牌亮點
        async function aiRefineBrand() {
            const rawSummary = document.getElementById('brandSummary').value.trim();
            if (!rawSummary) {
                alert('請先在欄位中貼上原始的品牌概要說明！');
                return;
            }

            const btn = event.target;
            btn.textContent = '⏳ AI 整理中...';

            try {
                const prompt = `請將以下冗長的品牌/產品介紹，萃取並改寫成 2-3 個最具吸引力的「核心亮點與痛點解決」，語氣要精煉吸引人，方便寫信給 KOL 時直接讓對方秒懂：\n\n${rawSummary}`;
                const resultText = await callGeminiAPI(prompt);
                if (resultText) {
                    document.getElementById('brandSummary').value = resultText.trim();
                }
            } catch (error) {
                alert('AI 處理失敗：' + error.message);
                console.error(error);
            } finally {
                btn.textContent = '🪄 AI 濃縮亮點';
            }
        }

        // 2. AI 生成趣味且高轉換的邀約信
        async function aiGenerateEmail() {
            const brandSummary = document.getElementById('brandSummary').value.trim();
            const kolName = document.getElementById('kolName').value.trim() || '創作者';
            const kolHighlights = document.getElementById('kolHighlights').value.trim();
            const tone = document.getElementById('toneSelect').value;

            if (!brandSummary) {
                alert('請填寫品牌概要');
                return;
            }

            const outputSubject = document.getElementById('outputSubject');
            const outputBody = document.getElementById('outputBody');
            outputSubject.value = 'AI 正在構思好玩的信件主旨...';
            outputBody.value = '請稍候，AI 正在為這位 KOL 量身打造超有吸引力、告別罐頭感的趣味邀約信...';

            let toneDesc = '幽默好玩、像朋友聊天、打破傳統公關腔';
            if (tone === 'sincere') toneDesc = '真誠溫暖、有質感、像粉絲真心推坑';
            if (tone === 'cool') toneDesc = '俐落有型、酷帥、Z 世代社群風格';

            const prompt = `
你是一位頂尖的社群行銷專家，擅長寫出打開率極高、完全不像罐頭訊息的 KOL 合作邀約信。
請根據以下資訊，寫出一封信件的主旨與內文：

- KOL 稱呼：${kolName}
- KOL 近期特色/觀察：${kolHighlights ? kolHighlights : '優質的日常創作與獨特觀點'}
- 品牌/產品亮點：${brandSummary}
- 信件風格調性：${toneDesc}

【寫作核心要求】
1. **絕對不要官腔**：開場必須自然、精準切中對方的近期特色（證明我們真的有發摟他），讓人覺得「哇，你是真的懂我」。
2. **有趣好讀**：排版乾淨、段落分明，多用口語或生動比喻，讓創作者在滑手機時一眼就能看懂合作誘因。
3. **主旨（Subject）**：必須非常吸引人、帶有好奇心或誠意，避免被當成垃圾郵件。

請嚴格依照以下格式回傳（不要有多餘的廢話）：
主旨：[產出主旨]
---
[產出內文]
`;

            try {
                const text = await callGeminiAPI(prompt);
                if (text) {
                    const parts = text.split('---');
                    if (parts.length >= 2) {
                        const subjectLine = parts[0].replace('主旨：', '').trim();
                        const bodyLine = parts[1].trim();
                        outputSubject.value = subjectLine;
                        outputBody.value = bodyLine;
                    } else {
                        outputSubject.value = '【合作邀約】期待與您擦出精彩火花！';
                        outputBody.value = text.trim();
                    }
                }
            } catch (error) {
                alert('生成失敗：' + error.message);
                console.error(error);
                outputSubject.value = '';
                outputBody.value = '';
            }
        }

        // 一鍵複製
        function copyToClipboard() {
            const subject = document.getElementById('outputSubject').value;
            const body = document.getElementById('outputBody').value;
            const fullText = `主旨：${subject}\n\n${body}`;

            if (!body) {
                alert('目前沒有內容可複製');
                return;
            }

            navigator.clipboard.writeText(fullText).then(() => {
                const tip = document.getElementById('copyTip');
                tip.textContent = '✓ 內容已成功複製到剪貼簿！';
                setTimeout(() => tip.textContent = '', 3000);
            });
        }
    </script>
</body>
</html>
