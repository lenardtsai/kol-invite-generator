<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KOL 合作邀約信自動生成系統</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md py-4 px-6 mb-6">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold flex items-center gap-2">
                ✨ KOL 合作邀約信自動生成系統
            </h1>
            <span class="text-xs bg-indigo-500 px-3 py-1 rounded-full">高轉換趣味版</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 flex-grow w-full grid grid-cols-1 md:grid-cols-2 gap-6 mb-12">
        
        <!-- 左側：輸入表單區 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-5">
            <h2 class="text-lg font-semibold text-indigo-900 border-b pb-2">1. 填寫專案與 KOL 資訊</h2>

            <!-- 品牌概要欄位 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">品牌與產品核心亮點</label>
                <textarea id="brandSummary" rows="4" class="w-full rounded-lg border border-slate-300 p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="請填寫品牌介紹、主打商品、吸引人的合作福利或核心賣點..."></textarea>
            </div>

            <!-- KOL 資訊與特色 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">KOL 名稱 / 帳號與近期觀察特色</label>
                <input type="text" id="kolName" placeholder="例如：卡特 / @cat_daily" class="w-full rounded-lg border border-slate-300 px-3 py-2 text-sm mb-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                <textarea id="kolHighlights" rows="3" class="w-full rounded-lg border border-slate-300 p-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none" placeholder="輸入 KOL 近期特色（例如：近期都在開箱好物、限動常搞笑吐槽、說話風格直率幽默等）..."></textarea>
            </div>

            <!-- 信件風格設定 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">信件調性風格</label>
                <select id="toneSelect" class="w-full rounded-lg border border-slate-300 p-2 text-sm focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                    <option value="humorous">🔥 幽默好玩、像朋友聊天（最高回覆率）</option>
                    <option value="sincere">✨ 真誠溫暖、有質感與溫度</option>
                    <option value="cool">😎 俐落有型、Z 世代潮流感</option>
                </select>
            </div>

            <button onclick="generateEmail()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-3 rounded-lg shadow transition duration-200 mt-2">
                🚀 一鍵產生超吸睛邀約信
            </button>
        </div>

        <!-- 右側：結果與複製區 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 flex flex-col gap-5">
            <div class="flex justify-between items-center border-b pb-2">
                <h2 class="text-lg font-semibold text-indigo-900">2. 生成結果與複製</h2>
                <button onclick="copyToClipboard()" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs px-3 py-1.5 rounded-lg font-medium flex items-center gap-1 transition">
                    📋 一鍵複製全部
                </button>
            </div>

            <!-- 郵件主旨 -->
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">建議信件主旨</label>
                <input type="text" id="outputSubject" readonly class="w-full bg-slate-50 rounded-lg border border-slate-200 px-3 py-2 text-sm text-slate-700 focus:outline-none">
            </div>

            <!-- 信件內文 -->
            <div class="flex-grow flex flex-col">
                <label class="block text-sm font-medium text-slate-700 mb-1">完整邀約信內文</label>
                <textarea id="outputBody" rows="14" readonly class="w-full flex-grow bg-slate-50 rounded-lg border border-slate-200 p-3 text-sm text-slate-700 focus:outline-none" placeholder="點擊左側「一鍵產生超吸睛邀約信」後，客製化信件將會顯示在此..."></textarea>
            </div>

            <p id="copyTip" class="text-xs text-emerald-600 text-right h-4"></p>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center py-6 text-xs text-slate-400 border-t border-slate-200">
        KOL Collaboration Invitation System &copy; 2026. Hosted on GitHub Pages.
    </footer>

    <!-- JavaScript 智慧生成邏輯 -->
    <script>
        function generateEmail() {
            const brandSummary = document.getElementById('brandSummary').value.trim();
            const kolName = document.getElementById('kolName').value.trim() || '創作者';
            const kolHighlights = document.getElementById('kolHighlights').value.trim() || '近期優質又吸睛的創作內容';
            const tone = document.getElementById('toneSelect').value;

            if (!brandSummary) {
                alert('請先填寫品牌與產品核心亮點！');
                return;
            }

            let subject = '';
            let body = '';

            if (tone === 'humorous') {
                subject = `🔥 [${kolName}] 被你的內容燒到！有個超好玩的新品想邀請你來玩`;
                body = `${kolName} 你好呀！\n\n` +
                       `每次滑到你的動態都笑死（或是被燒到體無完膚），特別是注意到你近期在「${kolHighlights}」的表現，真的超有個人特色又吸引人！\n\n` +
                       `我們最近正忙著推廣一個超讚的項目：\n👉 ${brandSummary}\n\n` +
                       `真心覺得這個超級適合你的風格，完全不是那種無聊死板的罐頭品牌。想問你有沒有興趣一起合作或搶先體驗看看？\n\n` +
                       `如果覺得有興趣，隨時回覆我，我們來聊聊怎麼玩最開心！祝今天順心～`;
            } else if (tone === 'sincere') {
                subject = `【誠摯邀請】期待與風格獨具的 [${kolName}] 展開深度合作`;
                body = `${kolName} 您好：\n\n` +
                       `我是本次專案的品牌行銷團隊代表。我們長期關注您的社群，非常欣賞您一直以來在「${kolHighlights}」所展現的質感與用心。\n\n` +
                       `我們近期推出的品牌核心亮點為：\n・ ${brandSummary}\n\n` +
                       `我們深信您的受眾與這項目的理念高度契合，因此誠摯希望邀請您參與本次合作，透過您的視角傳遞美好的體驗給粉絲們。\n\n` +
                       `若您有興趣進一步了解詳細的合作企劃與福利，歡迎隨時回信與我們聯繫。期待您的佳音！`;
            } else { // cool
                subject = `⚡️ [${kolName}] 解鎖新企劃：這個質感好物想找你一起搞點事情`;
                body = `Hey ${kolName}！\n\n` +
                       `關注你很久了，特別是看到你最近在「${kolHighlights}」的內容，完全就是走在潮流前端。\n\n` +
                       `我們最近搞了一個很酷的新專案：\n⚡️ ${brandSummary}\n\n` +
                       `覺得你的調性跟這個超搭，想問你有沒有興趣接招、一起擦出新火花？\n\n` +
                       `有興趣的話敲我一下，我們把詳細企劃傳給你瞧瞧！`;
            }

            document.getElementById('outputSubject').value = subject;
            document.getElementById('outputBody').value = body;
            document.getElementById('copyTip5') ? document.getElementById('copyTip5').textContent = '' : null;
        }

        function copyToClipboard() {
            const subject = document.getElementById('outputSubject').value;
            const body = document.getElementById('outputBody').value;
            const fullText = `主旨：${subject}\n\n${body}`;

            if (!body) {
                alert('目前沒有內容可複製，請先點擊產生按鈕。');
                return;
            }

            navigator.clipboard.writeText(fullText).then(() => {
                const tip = document.getElementById('copyTip');
                tip.textContent = '✓ 內容已成功複製到剪貼簿！';
                setTimeout(() => {
                    tip.textContent = '';
                }, 3000);
            });
        }
    </script>
</body>
</html>
